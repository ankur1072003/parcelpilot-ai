services:
  - type: web
    name: parcelpilot-ai
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python scripts/ingest.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: APP_ENV
        value: production
