<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ParcelPilot Ops Copilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#14171c; --panel:#1b1f26; --panel-2:#20252d; --border:#2b313b;
    --text:#e7ebf0; --text-dim:#9aa4b2; --accent:#4f8cff; --warn:#e0a53a;
    --ok:#3fbf7f; --mono:'IBM Plex Mono','SF Mono',monospace; --sans:'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;}
  aside{width:260px;background:var(--panel);border-right:1px solid var(--border);padding:20px;flex-shrink:0;overflow-y:auto;}
  aside h1{font-size:15px;letter-spacing:.02em;margin:0 0 4px;color:var(--text);}
  aside .sub{font-size:11px;color:var(--text-dim);margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;}
  select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px;}
  .scope-tag{display:inline-block;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;font-family:var(--mono);margin:2px 4px 0 0;color:var(--text-dim);}
  .samples{display:flex;flex-direction:column;gap:6px;}
  .samples button{text-align:left;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-size:12px;padding:8px;border-radius:6px;cursor:pointer;}
  .samples button:hover{border-color:var(--accent);color:var(--text);}
  main{flex:1;display:flex;flex-direction:column;min-width:0;}
  header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  header .title{font-size:14px;color:var(--text-dim);}
  #chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px;}
  .msg{max-width:720px;}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px 10px 2px 10px;}
  .msg.assistant{align-self:flex-start;}
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--border);padding:12px 14px;border-radius:2px 10px 10px 10px;}
  .trace{margin-top:6px;display:flex;flex-direction:column;gap:4px;}
  .trace-item{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;}
  .trace-item.doc:before{content:"🔎 ";}
  .trace-item.struct:before{content:"🗄 ";}
  .trace-item.action:before{content:"⚠ ";}
  .action-card{border:1px solid var(--warn);background:rgba(224,165,58,.08);border-radius:8px;padding:12px 14px;margin-top:8px;max-width:420px;}
  .action-card .id{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .action-card button{margin-top:8px;margin-right:8px;padding:6px 14px;border-radius:6px;border:none;font-size:12px;cursor:pointer;}
  .btn-confirm{background:var(--ok);color:#08160f;}
  .btn-cancel{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border) !important;}
  footer{border-top:1px solid var(--border);padding:16px 24px;display:flex;gap:10px;}
  footer input{flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;}
  footer button{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;}
  .note{font-size:11px;color:var(--text-dim);padding:10px 24px;border-top:1px solid var(--border);}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;}
</style>
</head>
<body>

<aside>
  <h1>ParcelPilot</h1>
  <div class="sub">Internal Ops Copilot</div>

  <div class="field">
    <label>Signed in as</label>
    <select id="userSelect">
      <option value="agent_rohit">Rohit — Support Agent</option>
      <option value="agent_maya">Maya — Support Agent</option>
      <option value="manager_priya">Priya — Support Manager</option>
    </select>
  </div>

  <div class="field">
    <label>Permitted scope</label>
    <div id="scopeTags"></div>
  </div>

  <div class="field">
    <label>Try asking</label>
    <div class="samples">
      <button data-q="Can Northstar cancel ORD-1001 without a cancellation fee? Explain why.">Northstar / ORD-1001 cancellation fee</button>
      <button data-q="A pickup on ORD-2002 is late because of carrier fault. Should LumenWorks get a service credit?">ORD-2002 late pickup credit</button>
      <button data-q="Can Beacon Retail cancel ORD-3001 without a fee?">Beacon Retail / ORD-3001</button>
      <button data-q="TKT-501 says Northstar can't create any shipments. What's going on and what should we do?">TKT-501 outage triage</button>
    </div>
  </div>

  <div class="field">
    <label>Ops Insights</label>
    <button onclick="loadInsights()" style="width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);padding:8px;border-radius:6px;cursor:pointer;font-size:12px;">Refresh proactive issues</button>
    <div id="insights" style="margin-top:10px;font-size:12px;color:var(--text-dim);"></div>
  </div>
</aside>

<main>
  <header>
    <div class="title"><span class="status-dot"></span>ParcelPilot Support / Operations Copilot</div>
    <div class="title" id="apiStatus">checking API…</div>
  </header>
  <div id="chat"></div>
  <footer>
    <input id="input" placeholder="Ask about an order, account, ticket, or policy…" onkeydown="if(event.key==='Enter')send()"/>
    <button onclick="send()">Send</button>
  </footer>
  <div class="note">
    Tool activity is shown under each response. State-changing actions always require a separate confirm click — the agent cannot execute them itself.
  </div>
</main>

<script>
const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
let conversation = [];

const SCOPES = {
  agent_rohit: ['ACCT-001','ACCT-003'],
  agent_maya: ['ACCT-002','ACCT-004'],
  manager_priya: ['ALL ACCOUNTS'],
};

function renderScope(){
  const user = document.getElementById('userSelect').value;
  document.getElementById('scopeTags').innerHTML = SCOPES[user].map(s=>`<span class="scope-tag">${s}</span>`).join('');
}
document.getElementById('userSelect').addEventListener('change', ()=>{ renderScope(); conversation=[]; document.getElementById('chat').innerHTML=''; });
renderScope();

document.querySelectorAll('.samples button').forEach(b=>{
  b.addEventListener('click', ()=>{ document.getElementById('input').value = b.dataset.q; send(); });
});

async function checkHealth(){
  try {
    const r = await fetch(`${API_BASE}/api/health`);
    document.getElementById('apiStatus').textContent = r.ok ? 'API connected' : 'API error';
  } catch(e){
    document.getElementById('apiStatus').textContent = 'API not reachable (start backend on :8000)';
  }
}
checkHealth();

function addMessage(role, html){
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = role === 'assistant' ? `<div class="bubble">${html}</div>` : html;
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = 1e9;
  return div;
}

function traceLabel(t){
  if (t.tool === 'search_documents') return {cls:'doc', text:`search_documents("${t.input.query}")`};
  if (t.tool === 'query_structured_data') return {cls:'struct', text:`query_structured_data(${t.input.operation})`};
  if (t.tool === 'prepare_escalation') return {cls:'action', text:`prepare_escalation → pending confirmation`};
  return {cls:'', text: t.tool};
}

async function send(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);
  conversation.push({role:'user', content:text});

  const user = document.getElementById('userSelect').value;
  const thinking = addMessage('assistant', '<em style="color:var(--text-dim)">thinking…</em>');

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({demo_user_id:user, conversation})
    });
    const data = await res.json();
    if (!res.ok) {
      thinking.querySelector('.bubble').innerHTML = `<span style="color:var(--warn)">Error: ${data.detail || 'request failed'}</span>` +
        `<div style="font-size:11px;color:var(--text-dim);margin-top:6px;">This demo requires OPENAI_API_KEY to be set on the backend for live chat. The deterministic tool layer (auth, source authority, actions, ops insights) works without it — try the sidebar's Ops Insights button.</div>`;
      return;
    }
    conversation.push({role:'assistant', content:data.response});
    let html = data.response.replace(/\n/g,'<br/>');
    if (data.tool_trace && data.tool_trace.length){
      html += '<div class="trace">' + data.tool_trace.map(t=>{
        const {cls,text} = traceLabel(t);
        return `<div class="trace-item ${cls}">${text}</div>`;
      }).join('') + '</div>';
      const escalation = data.tool_trace.find(t=>t.tool==='prepare_escalation' && t.result && t.result.action_id);
      if (escalation){
        html += renderActionCard(escalation.result);
      }
    }
    thinking.querySelector('.bubble').innerHTML = html;
  } catch(e){
    thinking.querySelector('.bubble').innerHTML = `<span style="color:var(--warn)">Could not reach the backend at ${API_BASE || location.origin}.</span>`;
  }
}

let pendingActionId = null;
function renderActionCard(action){
  pendingActionId = action.action_id;
  return `<div class="action-card" id="pendingActionButtons">
    <div><strong>Proposed escalation</strong></div>
    <div class="id">${action.action_id} · account ${action.account_id}</div>
    <div style="font-size:13px;margin-top:6px;">${action.payload.reason}</div>
    <button class="btn-confirm" onclick="confirmAction(true)">Confirm</button>
    <button class="btn-cancel" onclick="confirmAction(false)">Cancel</button>
  </div>`;
}

async function confirmAction(confirm){
  const user = document.getElementById('userSelect').value;
  const res = await fetch(`${API_BASE}/api/actions/${pendingActionId}/confirm`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({demo_user_id:user, confirm})
  });
  const data = await res.json();
  addMessage('assistant', confirm
    ? `<span style="color:var(--ok)">Escalation ${data.action_id} executed.</span>`
    : `<span style="color:var(--text-dim)">Escalation ${data.action_id} cancelled.</span>`);
}

async function loadInsights(){
  const user = document.getElementById('userSelect').value;
  const box = document.getElementById('insights');
  box.textContent = 'loading…';
  try {
    const res = await fetch(`${API_BASE}/api/ops/insights?demo_user_id=${user}`);
    const data = await res.json();
    if (!res.ok){ box.textContent = data.detail || 'Not authorized for ops insights (manager/admin only).'; return; }
    if (!data.insights.length){ box.textContent = 'No flagged issues.'; return; }
    box.innerHTML = data.insights.map(i=>`<div style="margin-bottom:8px;padding:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;">
      <strong style="font-size:11px;color:var(--text);">${i.title}</strong><br/>
      <span style="font-family:var(--mono);">${i.affected_tickets.join(', ')}</span>
    </div>`).join('');
  } catch(e){
    box.textContent = 'Backend not reachable.';
  }
}
</script>
</body>
</html>
